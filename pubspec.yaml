name: fancy_clock
description: FancyClock - digit clock for square Android displays with random fonts and ambient-aware theme.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  leak_tracker: ^11.0.0
  leak_tracker_flutter_testing: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts_manifest.json
    - assets/fonts/
